<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: #ffffff; display: flex; align-items: center; justify-content: center; height: 300px; width: 1200px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
        
        /* The Container */
        .banner { width: 100%; height: 100%; position: relative; padding-left: 450px; /* Leaves room for your LinkedIn profile pic */ display: flex; flex-direction: column; justify-content: center; }

        /* CareScribe Header */
        .brand { font-size: 80px; font-weight: 800; color: #111111; letter-spacing: -2px; line-height: 1; margin: 0; position: relative; }

        /* Sub-Brand: by ProtolQ */
        .sub-brand { font-size: 32px; font-weight: 400; color: #555555; position: absolute; left: 168px; /* This aligns it under the 'S' in Scribe */ top: 75px; letter-spacing: 0; }

        /* The Tagline */
        .tagline { margin-top: 60px; font-size: 36px; font-weight: 500; color: #111111; letter-spacing: -0.5px; border-top: 1px solid #eeeeee; padding-top: 15px; width: fit-content; }
    </style>
</head>
<body>
    <div class="banner">
        <div class="brand">
            CareScribe
            <div class="sub-brand">by ProtolQ</div>
        </div>
        <div class="tagline">Detecting Documentation Risks Before Inspections</div>
    </div>
</body>
</html>
